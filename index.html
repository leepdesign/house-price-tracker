      background: #f4f7fa;

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }

    label { display: block; margin-bottom: 7px; font-weight: 650; }

    input { border: 1px solid #b9cad8; }
    button { margin-top: 14px; border: 1px solid #204e77; color: white; background: #204e77; font-weight: 650; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    :focus-visible { outline: 2px solid #2877b0; outline-offset: 2px; }
    #message { margin: 10px 0 0; color: #9c3025; font-size: .92rem; }
    #message:empty { margin: 0; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f7fa; }
  </style>
